name: Validación técnica
on:
  push:
    branches: [main, "improvement/**", "maintenance/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas scikit-learn==1.8.0
      - run: python -m unittest discover -s tests -v
      - run: python SPAIN2035_prueba_aislada_seguimiento.py
      - run: python validar_modelo.py
      - uses: actions/upload-artifact@v4
        with:
          name: validacion-modelos
          path: resultados/validacion.json
